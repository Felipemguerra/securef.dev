name: Security scans

on:
  pull_request:
    branches: 
      - master

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  baseline:
    uses: Felipemguerra/configs/actions/security-baseline.yaml@master

  semgrep:
    uses: Felipemguerra/configs/actions/semgrep.yaml@master

  secret-scan:
    uses: Felipemguerra/configs/actions/secret-scan.yaml@master
    with:
      configs-ref: master
    secrets: inherit